<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DriveMate</title>
<meta name="theme-color" content="#0F121C">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{
  color-scheme:dark;
  --bg:#0F121C; --surface:#171C29; --ink:#F2F5F7; --muted:#9AA4B5; --line:#283044;
  --g1:#7BE35A; --g2:#1FB86E; --grad:linear-gradient(135deg,var(--g1),var(--g2));
  --road:#5AD864; --road-ink:#0B0E16; --biz:#4FD36A; --biz-soft:#15301F; --priv:#8D98A5; --warn:#F5A05C; --warn-soft:#3A2519;
  --plate:#F2F5F7; --plate-ink:#0F121C; --plate-edge:#4FD36A;
  --sans:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --cond:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
[hidden]{display:none!important}
.chk{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk .ok{color:var(--biz)} .chk .no{color:var(--warn)}
#gpsline .linkbtn{display:inline;padding:0;margin:0 0 0 6px;min-height:0}
h1,h2,h3{font-family:var(--sans);font-weight:700;margin:0;line-height:1.2}
h1{font-size:24px;margin-bottom:14px} h2{font-size:18px;margin:28px 0 10px} h3{font-size:16px}
p{margin:0 0 8px}
.muted{color:var(--muted)} .small{font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--road);outline-offset:2px}
.topbar{display:none}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.brand img{height:34px;width:auto;display:block}
.wm{font-style:italic;font-weight:800;font-size:22px;letter-spacing:-.3px;line-height:1}
.wm b{color:var(--ink);font-weight:800} .wm i{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;font-style:italic}
.sync{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;white-space:nowrap;font-weight:600}
.chip[aria-pressed="true"]{border-color:var(--biz);background:var(--biz-soft);color:var(--biz)}
.panel{background:var(--surface);border-radius:14px;padding:16px;border:1px solid var(--line)}
.panel + .panel{margin-top:12px}
/* Odometer plate: the one memorable element */
.plate-wrap{text-align:center;padding:22px 12px 18px}
.plate-label{font-size:14px;color:var(--muted);margin-bottom:8px}
.plate{display:inline-flex;gap:4px;padding:10px 12px;background:var(--plate);border:3px solid var(--plate-edge);border-radius:10px}
.digit{width:clamp(28px,8.5vw,34px);height:52px;overflow:hidden;background:#fff;border-radius:4px;box-shadow:inset 0 0 0 1px #c9d3df;position:relative}
.digit .reel{position:absolute;left:0;right:0;top:0;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.digit span{display:block;height:52px;line-height:52px;text-align:center;font-family:var(--cond);font-weight:700;font-size:40px;color:var(--plate-ink)}
.plate .unit{align-self:flex-end;font-family:var(--cond);font-weight:700;color:var(--plate-ink);padding-left:4px;font-size:18px}
@media (prefers-reduced-motion: reduce){.digit .reel{transition:none}}
.plate-sub{margin-top:10px;font-size:14px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:12px 18px;min-height:50px;font-weight:700;background:var(--ink);color:var(--surface)}
.btn.road{background:var(--grad);color:var(--road-ink)}
.btn.biz{background:var(--grad);color:var(--road-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--warn);border:1.5px solid var(--warn)}
.btn.block{width:100%}
.start{width:100%;min-height:92px;font-family:var(--sans);font-style:italic;font-weight:800;font-size:28px;border-radius:18px;box-shadow:0 8px 28px rgba(79,211,106,.25)}
.linkbtn{background:none;border:0;color:var(--ink);text-decoration:underline;text-underline-offset:3px;padding:10px 0;font-weight:600}
.banner{background:var(--warn-soft);border:1.5px solid var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.banner strong{color:var(--warn)}
.row{display:flex;gap:10px;align-items:center}
.row > *{flex:1;min-width:0}
input[type=date],input[type=datetime-local]{min-width:0;font-size:15px;padding-left:10px;padding-right:6px}
label{display:block;font-size:14px;font-weight:600;margin:12px 0 4px}
input,select,textarea{width:100%;min-height:48px;font-size:16px;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
input[type=checkbox]{width:auto}
.check{display:flex;gap:10px;align-items:center;font-weight:500;margin-top:12px}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:transparent;padding:10px;min-height:46px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button.biz[aria-pressed="true"]{background:var(--grad);color:var(--road-ink)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat .v{font-family:var(--cond);font-weight:700;font-size:28px;line-height:1.1}
.stat .k{font-size:13px;color:var(--muted)}
.stat.big .v{font-size:34px;color:var(--biz)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:8px 0 4px}
.bar > i{display:block;height:100%;background:var(--grad)}
.live{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.live .t{font-family:var(--cond);font-size:44px;font-weight:700}
.pulse{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--biz);margin-right:6px;animation:p 1.6s infinite}
@keyframes p{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.quick button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:14px}
.list{list-style:none;margin:0;padding:0}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 2px;border-bottom:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.item .km{margin-left:auto;font-family:var(--cond);font-weight:700;font-size:22px;white-space:nowrap}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;margin-right:6px}
.tag.b{background:var(--biz-soft);color:var(--biz)} .tag.p{background:var(--line);color:var(--muted)}
.day{font-size:13px;font-weight:700;color:var(--muted);margin-top:16px}
.empty{padding:28px 8px;text-align:center;color:var(--muted)}
.appbar{max-width:560px;margin:0 auto;padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
nav.tabs .in{display:flex;max-width:560px;margin:0 auto;padding:0 8px}
nav.tabs button{flex:1;background:none;border:0;border-bottom:3px solid transparent;padding:8px 2px 9px;font-weight:600;font-size:13px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;min-height:58px}
nav.tabs button[aria-current="page"]{color:var(--biz);border-bottom-color:var(--biz)}
nav.tabs button[aria-current="page"] svg{stroke:var(--biz)}
nav.tabs svg{width:24px;height:24px;fill:none;stroke:var(--muted);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.screen{max-width:560px;margin:0 auto;padding:4px 16px 40px}
.screen-head{display:flex;align-items:center;gap:6px;margin:0 -6px 8px;padding:6px 0;border-bottom:1px solid var(--line)}
.back{background:none;border:0;color:var(--biz);font-weight:600;display:flex;align-items:center;gap:4px;padding:10px 8px;min-height:44px}
.back svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.screen-head h3{font-size:17px}
.actions{display:flex;gap:10px;margin-top:18px}
.actions > *{flex:1}
.err{color:var(--warn);font-size:14px;margin-top:6px;min-height:1em}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:700;color:var(--muted)}
.scroll{overflow-x:auto}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv b{font-family:var(--cond);font-size:20px}
.ok{color:var(--biz);font-weight:700}
.note{font-size:14px;color:var(--muted);margin-top:10px}
.toast{position:absolute;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
code{background:var(--line);padding:2px 6px;border-radius:5px;word-break:break-all;font-size:14px}
ol.steps{padding-left:20px;margin:6px 0} ol.steps li{margin-bottom:6px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.duo .btn{min-height:58px;font-size:15px;white-space:nowrap;padding:12px 10px}
.btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cam{width:100%;min-height:64px;border:2px dashed var(--line);border-radius:12px;background:var(--surface);font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px}
.cam svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2}
.receipt{display:flex;gap:12px;align-items:center;margin-top:10px}
.receipt img{width:72px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.receipt-full{max-width:100%;border-radius:10px;border:1px solid var(--line);margin-top:10px}
.scan{font-size:14px;color:var(--muted)}
.hidden{display:none}
.social{display:grid;gap:10px;margin-top:4px}
.social .btn{background:var(--surface);color:var(--ink);border:1.5px solid var(--line);font-weight:600}
.social .btn svg{width:20px;height:20px}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px;margin:16px 0 4px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.legal{font-size:13px;color:var(--muted);margin-top:14px}
.legal a{color:var(--ink)}
.check a{color:var(--biz)}
.notice{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px))}
.notice .in{max-width:560px;margin:0 auto;display:flex;gap:12px;align-items:center}
.notice p{margin:0;font-size:14px;flex:1}
.notice a{color:var(--biz)}
</style>
</head>
<body>
<header class="appbar"><span class="brand" id="brand"></span><span class="sync" id="sync">Saved on this phone</span></header>
<nav class="tabs" id="tabsNav" aria-label="Sections"><div class="in" id="tabs"></div></nav>
<main id="app"></main>
<div id="screens"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- constants ---------- */
const CPK = {2020:.72,2021:.72,2022:.78,2023:.85,2024:.88,2025:.88,2026:.91}; // keyed by FY start year
const CPK_CAP = 5000;
const EXP_CATS = ["Fuel","Maintenance & servicing","Repairs","Registration","Insurance","Tyres","Tolls & parking","Cleaning","Depreciation","Interest / lease","Other"];
const LS_KEY = "kmlog.v1"; // keep key so existing data carries over

/* ---------- state ---------- */
let S = blank();
function blank(){ return {settings:{taxRate:.30, medicare:true, active:null}, vehicles:[], odo:[], expenses:[], trips:[], live:null}; }
const uid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const $ = (s,el=document)=>el.querySelector(s);
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
const fmtKm = n => Math.round(n).toLocaleString("en-AU");
const money = n => n.toLocaleString("en-AU",{style:"currency",currency:"AUD",maximumFractionDigits:0});
const pct = n => (n*100).toFixed(1)+"%";
const dFmt = ts => new Date(ts).toLocaleDateString("en-AU",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
const tFmt = ts => new Date(ts).toLocaleTimeString("en-AU",{hour:"numeric",minute:"2-digit"});
const isoDate = ts => { const d=new Date(ts); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const isoLocal = ts => { const d=new Date(ts); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,16); };
const fyOf = ts => { const d=new Date(ts); return d.getMonth()>=6 ? d.getFullYear() : d.getFullYear()-1; };
const fyLabel = y => `${y}–${String(y+1).slice(-2)}`;
const fyRange = y => [new Date(y,6,1).getTime(), new Date(y+1,6,1).getTime()];
const rateFor = y => CPK[y] ?? CPK[Math.max(...Object.keys(CPK).map(Number))];
const monthKey = ts => { const d=new Date(ts); return `m-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`; };
const tripKm = t => Math.max(0,(t.endOdo||0)-(t.startOdo||0));

/* ---------- storage: local mirror + cloud (claude.ai, or a DriveMate account) ---------- */
const API_HOST = "https://drivemate.agency-log.workers.dev"; // the Android app loads the page from file://
let cloud=null, me=null, saveTimer=null, retryTimer=null, dirtyCfg=false, dirtyMonths=new Set(), syncState="local";
let account=null; // {token,email} when signed in to a DriveMate account
const inClaude = () => !!(window.claude && typeof claude.use==="function");
const apiBase = () => location.protocol==="file:" ? API_HOST : "";
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} }
function loadLocal(){
  try{ const raw=lsGet(LS_KEY); if(raw){ S=Object.assign(blank(),JSON.parse(raw)); } }catch(e){}
  try{ const p=JSON.parse(lsGet("dm.pending")||"null"); if(p){ dirtyCfg=!!p.cfg; (p.months||[]).forEach(m=>dirtyMonths.add(m)); } }catch(e){}
  try{ account=JSON.parse(lsGet("dm.auth")||"null"); }catch(e){ account=null; }
}
function saveLocal(){ lsSet(LS_KEY,JSON.stringify(S)); }
// Changes not yet in the cloud survive a restart, so they're pushed before the next pull.
function savePending(){ lsSet("dm.pending",JSON.stringify({cfg:dirtyCfg,months:[...dirtyMonths]})); }
function saveAuth(a){ account=a; lsSet("dm.auth",a?JSON.stringify(a):null); }
function markAllDirty(){ dirtyCfg=true; S.trips.forEach(t=>dirtyMonths.add(monthKey(t.startTs))); savePending(); }
const hasPending = () => dirtyCfg || dirtyMonths.size>0;
const savedLabel = () => "Saved to your account";
function persist(opts={}){
  saveLocal();
  dirtyCfg = true;
  (opts.months||[]).forEach(m=>dirtyMonths.add(m));
  savePending();
  clearTimeout(saveTimer); saveTimer=setTimeout(pushCloud,700);
}
async function pushCloud(store=cloud,id=me){
  if(!store||!id||!hasPending()) return;
  const cfgWas=dirtyCfg, months=[...dirtyMonths];
  dirtyCfg=false; dirtyMonths.clear();
  try{
    setSync("Saving…");
    const col = store.collection(`data/users/${id}`);
    if(cfgWas){ const {trips,...cfg}=S; await col.doc("config").set(JSON.parse(JSON.stringify(cfg))); }
    for(const m of months){
      const list = S.trips.filter(t=>monthKey(t.startTs)===m);
      if(list.length) await col.doc(m).set({trips:list}); else await col.doc(m).delete();
    }
    savePending(); setSync(savedLabel());
  }catch(e){
    if(cfgWas) dirtyCfg=true; months.forEach(m=>dirtyMonths.add(m)); savePending();
    setSync("Saved on this phone · syncs when online");
    clearTimeout(retryTimer); retryTimer=setTimeout(()=>pushCloud(),30000);
  }
}
function fromDocs(docs){
  const next=blank(), trips=[];
  docs.forEach(doc=>{ const v=doc.data()||{}; if(doc.id==="config") Object.assign(next,JSON.parse(JSON.stringify(v))); else if(Array.isArray(v.trips)) trips.push(...JSON.parse(JSON.stringify(v.trips))); });
  next.trips=trips; return next;
}
function mergeData(base,extra){ // everything in base, plus anything in extra that base doesn't have
  const out=JSON.parse(JSON.stringify(base));
  ["vehicles","odo","expenses","trips"].forEach(k=>{ out[k]=out[k]||[]; const ids=new Set(out[k].map(x=>x.id)); (extra[k]||[]).forEach(x=>{ if(!ids.has(x.id)) out[k].push(x); }); });
  if(!out.settings.active) out.settings.active=(extra.settings&&extra.settings.active)||(out.vehicles[0]&&out.vehicles[0].id)||null;
  out.live=out.live||extra.live||null;
  return out;
}
/** Link the page to a cloud store. `merge` keeps this phone's data alongside the account's (first sign-in). */
async function connect(store,id,{merge=false}={}){
  if(hasPending() && !merge){ await pushCloud(store,id); if(hasPending()) throw new Error("offline"); }
  const snap = await store.collection(`data/users/${id}`).get();
  const local = S.vehicles.length||S.trips.length;
  cloud=store; me=id;
  if(snap.empty){
    if(local){ markAllDirty(); await pushCloud(); } else setSync(savedLabel());
    return;
  }
  const remote=fromDocs(snap.docs);
  if(merge && local){ S=mergeData(remote,S); saveLocal(); markAllDirty(); await pushCloud(); }
  else { remote.live = remote.live || S.live; S=remote; saveLocal(); setSync(savedLabel()); }
}
async function initCloud(){
  if(inClaude()){
    try{
      const [d,u] = await Promise.all([claude.use("db"),claude.use("user")]);
      if(!d||!u) return;
      const id = await u.id(); if(!id) return;
      await connect(d,id); render();
    }catch(e){ setSync("Saved on this phone only"); }
    return;
  }
  if(!account) return;
  setSync("Syncing…");
  refreshMe();
  try{ await connect(accountStore,"me"); if(!screenStack.length) render(); }
  catch(e){ if(account) setSync("Saved on this phone · syncs when online"); }
}
function setSync(t){ syncState=t; const el=$("#sync"); if(el) el.textContent=t; }

/* ---------- DriveMate accounts ---------- */
async function api(path,{method="GET",body}={}){
  const h={"Content-Type":"application/json"}; if(account&&account.token) h.Authorization="Bearer "+account.token;
  let r;
  try{ r=await fetch(apiBase()+"/api/"+path,{method,headers:h,body:body?JSON.stringify(body):undefined}); }
  catch(e){ throw new Error("You're offline. Check your connection and try again."); }
  const j=await r.json().catch(()=>({}));
  if(!r.ok){ const err=new Error(j.error||"Something went wrong. Try again."); err.status=r.status; if(r.status===401&&account&&h.Authorization) sessionEnded(); throw err; }
  return j;
}
// Same shape as the claude.ai store the sync code was written against.
const accountStore={ collection(){ return {
  async get(){ const {docs}=await api("data"); return {empty:!docs.length,docs:docs.map(d=>({id:d.id,data:()=>d.data}))}; },
  doc(id){ const p="data/"+encodeURIComponent(id); return { set:data=>api(p,{method:"PUT",body:{data}}), delete:()=>api(p,{method:"DELETE"}) }; }
}; } };
async function signedIn(res,isNew){
  saveAuth({token:res.token,email:res.email}); lsSet("dm.local",null);
  await refreshMe();
  setSync("Syncing…");
  try{ await connect(accountStore,"me",{merge:true}); }catch(e){ setSync("Saved on this phone · syncs when online"); }
  closeAllScreens(); tab="drive"; render(); toTop();
  if(res.recovery) recoverySheet(res.recovery,isNew);
  else toast("Signed in");
}
function clearPhone(){ if(S.live) stopGps(); S=blank(); saveLocal(); dirtyCfg=false; dirtyMonths.clear(); savePending(); cloud=null; me=null; saveAuth(null); }
function sessionEnded(){ cloud=null; me=null; saveAuth(null); setSync("Signed out"); closeAllScreens(); render(); toast("Signed out — sign in again to keep syncing"); }

/* ---------- derived data ---------- */
const veh = id => S.vehicles.find(v=>v.id===id);
const activeVeh = () => veh(S.settings.active) || S.vehicles[0] || null;
function readings(vid){ // every known odometer point for a vehicle
  const pts=[];
  const v=veh(vid); if(v&&v.startOdo!=null) pts.push({ts:v.startTs||0,odo:+v.startOdo});
  S.odo.filter(o=>o.vid===vid).forEach(o=>pts.push({ts:o.ts,odo:+o.value}));
  S.trips.filter(t=>t.vid===vid).forEach(t=>{ pts.push({ts:t.startTs,odo:+t.startOdo}); if(t.endOdo!=null) pts.push({ts:t.endTs||t.startTs,odo:+t.endOdo}); });
  return pts.sort((a,b)=>a.ts-b.ts);
}
function currentOdo(vid){ const r=readings(vid); return r.length? Math.max(...r.map(p=>p.odo)) : 0; }
function lastWeekly(vid){ return S.odo.filter(o=>o.vid===vid).sort((a,b)=>b.ts-a.ts)[0]||null; }
function periodStats(vid,from,to){
  const trips=S.trips.filter(t=>t.vid===vid&&t.startTs>=from&&t.startTs<to&&t.endOdo!=null);
  const biz=trips.filter(t=>t.type==="business").reduce((a,t)=>a+tripKm(t),0);
  const priv=trips.filter(t=>t.type!=="business").reduce((a,t)=>a+tripKm(t),0);
  const pts=readings(vid).filter(p=>p.ts>=from&&p.ts<to);
  let total = pts.length>=2 ? Math.max(...pts.map(p=>p.odo))-Math.min(...pts.map(p=>p.odo)) : 0;
  total = Math.max(total, biz+priv);
  const startOdo = pts.length? Math.min(...pts.map(p=>p.odo)) : null;
  const endOdo = pts.length? Math.max(...pts.map(p=>p.odo)) : null;
  return {trips,biz,priv,total,pctBiz: total? Math.min(1,biz/total):0, startOdo, endOdo};
}
function logbookInfo(v){
  if(!v.logStart) return null;
  const from=v.logStart, to=from+84*864e5, now=Date.now();
  const st=periodStats(v.id,from,Math.min(to,now+1));
  const weeks=Math.min(12,Math.floor((Math.min(now,to)-from)/(7*864e5)));
  return {from,to,done:now>=to,weeks,...st};
}
function claim(vid,fy){
  const v=veh(vid); const [from,to]=fyRange(fy);
  const st=periodStats(vid,from,to);
  const lb=v?logbookInfo(v):null;
  const usePct = lb&&lb.done&&lb.total ? lb.pctBiz : st.pctBiz;
  const pctSource = lb&&lb.done&&lb.total ? "12-week logbook" : "this year so far";
  const expenses=S.expenses.filter(e=>e.vid===vid&&e.ts>=from&&e.ts<to);
  const expTotal=expenses.reduce((a,e)=>a+(+e.amount||0),0);
  const rate=rateFor(fy);
  const cents=Math.min(st.biz,CPK_CAP)*rate;
  const logbook=expTotal*usePct;
  const best = logbook>cents ? "logbook" : "cents";
  const deduction=Math.max(cents,logbook);
  const mr=(+S.settings.taxRate||0)+(S.settings.medicare?.02:0);
  return {...st,lb,usePct,pctSource,expenses,expTotal,rate,cents,logbook,best,deduction,saving:deduction*mr,mr};
}

function startGps(){
  if(NATIVE){
    if(S.live){ try{ NATIVE.startTrip(String(S.live.startTs)); }catch(e){} if(!nPerms().fine){ try{ NATIVE.askLocation(); }catch(e){} } }
    return;
  }
  stopGps();
  if(!("geolocation" in navigator)||!S.live) return;
  try{
    geoWatch=navigator.geolocation.watchPosition(p=>{
      if(!S.live) return;
      const c={lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy};
      if(c.acc>60) return;
      if(lastFix){ const d=hav(lastFix,c); if(d>0.015 && d<5){ S.live.gpsKm=(S.live.gpsKm||0)+d; saveLocal(); } }
      lastFix=c; S.live.gps=true;
    },()=>{ if(S.live) S.live.gps=false; },{enableHighAccuracy:true,maximumAge:5000,timeout:20000});
  }catch(e){}
}
function stopGps(){ if(NATIVE){ try{ NATIVE.stopTrip(); }catch(e){} return; } if(geoWatch!=null){ try{navigator.geolocation.clearWatch(geoWatch);}catch(e){} } geoWatch=null; lastFix=null; }
function hav(a,b){ const R=6371,r=x=>x*Math.PI/180; const dLa=r(b.lat-a.lat),dLo=r(b.lon-a.lon); const h=Math.sin(dLa/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }

/* ---------- Google / Facebook sign-in, terms, storage notice ---------- */
let siteConfig={google:false,facebook:false};
const PROVIDER_ICONS={
  google:'<svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.27-4.74 3.27-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1A6.6 6.6 0 0 1 5.5 12c0-.73.13-1.44.34-2.1V7.06H2.18A11 11 0 0 0 1 12c0 1.77.42 3.45 1.18 4.94l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15A10.5 10.5 0 0 0 12 1 11 11 0 0 0 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>',
  facebook:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#1877F2"/><path fill="#fff" d="M15.12 15.47 15.6 12.4h-2.95v-2c0-.84.41-1.66 1.74-1.66h1.34V6.13s-1.22-.21-2.38-.21c-2.43 0-4.02 1.47-4.02 4.14v2.34H6.63v3.07h2.7V23a10.8 10.8 0 0 0 3.32 0v-7.53h2.47z"/></svg>'
};
const providerName = p => p==="google"?"Google":p==="facebook"?"Facebook":"another";
async function loadConfig(){
  if(inClaude()) return;
  try{ siteConfig=await api("config"); if(!account && !screenStack.length) render(); }catch(e){}
}
function providerButtons(){
  const ps=["google","facebook"].filter(p=>siteConfig[p]);
  if(!ps.length) return "";
  return `<div class="social">${ps.map(p=>`<button class="btn block" type="button" data-oauth="${p}">${PROVIDER_ICONS[p]}Continue with ${providerName(p)}</button>`).join("")}</div>
  <p class="legal" style="margin-top:8px">By continuing with ${ps.map(providerName).join(" or ")}, you agree to the <a href="/terms" target="_blank">Terms of Use</a> and <a href="/privacy" target="_blank">Privacy Policy</a>.</p>
  <div class="or">or use your email</div>`;
}
function startOAuth(p){
  const path=`/api/oauth/${p}/start`;
  // Google doesn't allow sign-in inside an app's web view, so the Android app hands over to the browser.
  if(NATIVE){ try{ NATIVE.openUrl(location.origin+path+"?app=1"); }catch(e){} toast("Finish signing in, then you'll come back here"); }
  else location.href=path;
}
async function authReturn(){
  const q=new URLSearchParams(location.search), h=new URLSearchParams(location.hash.slice(1));
  const code=h.get("code"), err=h.get("error");
  try{ history.replaceState(null,"","/"); }catch(e){}
  if(code && q.get("app")==="1" && !NATIVE){
    // Started in the Android app but the phone opened this page in the browser.
    sheet("Back to the app",`<p style="margin-top:12px">Nearly done. Tap below to finish signing in to the DriveMate app.</p>
      <a class="btn road block" href="intent://auth?code=${encodeURIComponent(code)}#Intent;scheme=drivemate;package=app.drivemate;end">Open DriveMate</a>
      <p class="small muted" style="margin-top:14px">Want to use DriveMate in this browser instead? <button class="linkbtn" id="arHere">Sign in here</button></p>`,
    (root,close)=>{ $("#arHere",root).onclick=()=>{ close(); finishOAuth(code); }; });
    return;
  }
  if(err){ toast(err==="cancelled"?"Sign-in cancelled":"Sign-in didn't work. Try again."); return; }
  if(code) finishOAuth(code);
}
async function finishOAuth(code){
  setSync("Signing in…");
  try{ await signedIn(await api("oauth/exchange",{method:"POST",body:{code}}),false); }
  catch(e){ setSync("Saved on this phone"); toast(e.message); }
}
window.dmAuth=code=>{ closeAllScreens(); finishOAuth(code); };
async function refreshMe(){
  if(!account||inClaude()) return;
  try{
    const m=await api("me");
    Object.assign(account,{email:m.email,hasPassword:m.hasPassword,providers:m.providers}); saveAuth(account);
    if(!m.termsAccepted) termsSheet();
  }catch(e){}
}
function termsSheet(){
  if(document.getElementById("tAccept")) return;
  sheet("Updated terms",`<p style="margin-top:12px">We've updated our <a href="/terms" target="_blank">Terms of Use</a> and <a href="/privacy" target="_blank">Privacy Policy</a>. Please review them and agree to keep using your account.</p>
    <div class="err" id="tErr"></div>
    <div class="actions"><button class="btn ghost" data-close>Not now</button><button class="btn road" id="tAccept">I agree</button></div>`,
  (root,close)=>{ $("#tAccept",root).onclick=async()=>{ try{ await api("terms",{method:"POST"}); close(); toast("Thanks"); }catch(e){ $("#tErr",root).textContent=e.message; } }; });
}
function storageNotice(){
  if(inClaude()||lsGet("dm.notice")) return;
  const el=document.createElement("div"); el.className="notice"; el.setAttribute("role","region"); el.setAttribute("aria-label","Storage notice");
  el.innerHTML=`<div class="in"><p>DriveMate stores your logbook and sign-in on this device so it works offline. We don't use advertising or tracking cookies. <a href="/privacy">Privacy Policy</a></p><button class="btn road" style="min-height:44px;padding:8px 20px">OK</button></div>`;
  el.querySelector("button").onclick=()=>{ lsSet("dm.notice","1"); el.remove(); };
  document.body.appendChild(el);
}

/* ---------- account screens ---------- */
let accountMode="create";
function accountScreen(){
  const c=accountMode==="create";
  return `${header(c?"Create your account":"Sign in")}
  <p class="muted">${c?"Your trips, odometer readings and expenses are saved to your account, so they're safe if you lose your phone and you can use them on another device.":"Sign in to get your trips, odometer readings and expenses on this device."}</p>
  <div class="panel">
    ${providerButtons()}
    <div class="seg" role="group"><button data-am="create" aria-pressed="${c}">Create account</button><button data-am="signin" aria-pressed="${!c}">Sign in</button></div>
    <form id="aForm" novalidate>
      <label for="aEmail">Email</label><input id="aEmail" name="email" type="email" autocomplete="username" inputmode="email" autocapitalize="off">
      <label for="aPass">Password</label><input id="aPass" name="password" type="password" autocomplete="${c?"new-password":"current-password"}" ${c?'minlength="8"':""}>
      ${c?`<p class="small muted" style="margin-top:6px">At least 8 characters.</p>`:`<div style="text-align:right"><button class="linkbtn" id="aForgot" type="button" style="padding:8px 0">Forgot your password?</button></div>`}
      ${c?`<label class="check"><input type="checkbox" id="aTerms"> <span>I agree to the <a href="/terms" target="_blank">Terms of Use</a> and <a href="/privacy" target="_blank">Privacy Policy</a></span></label>`:""}
      <div class="err" id="aErr"></div>
      <button class="btn road block" id="aGo" type="submit" style="margin-top:8px">${c?"Create account":"Sign in"}</button>
    </form>
  </div>
  <button class="linkbtn" id="aSkip" style="margin-top:12px">Use without an account</button>
  <p class="small muted">Without an account, everything is kept only on this ${NATIVE?"phone":"device"}. You can create an account later in Setup.</p>
  <p class="legal"><a href="/privacy" target="_blank">Privacy Policy</a> · <a href="/terms" target="_blank">Terms of Use</a></p>`;
}
function bindAccount(){
  document.querySelectorAll("[data-am]").forEach(b=>b.onclick=()=>{ accountMode=b.dataset.am; render(); });
  document.querySelectorAll("[data-oauth]").forEach(b=>b.onclick=()=>startOAuth(b.dataset.oauth));
  $("#aSkip").onclick=()=>{ lsSet("dm.local","1"); render(); };
  const f=$("#aForgot"); if(f) f.onclick=resetSheet;
  $("#aForm").onsubmit=async ev=>{
    ev.preventDefault();
    const btn=$("#aGo"), err=$("#aErr"), label=btn.textContent;
    err.textContent=""; btn.disabled=true; btn.textContent="One moment…";
    if(accountMode==="create" && !$("#aTerms").checked){ err.textContent="Please agree to the Terms of Use and Privacy Policy."; btn.disabled=false; btn.textContent=label; return; }
    try{
      const res=await api(accountMode==="create"?"signup":"login",{method:"POST",body:{email:$("#aEmail").value,password:$("#aPass").value,acceptTerms:accountMode==="create"}});
      await signedIn(res,accountMode==="create");
    }catch(e){ err.textContent=e.message; btn.disabled=false; btn.textContent=label; }
  };
}
function resetSheet(){
  sheet("Reset password",`
    <p class="muted small" style="margin-top:12px">Enter the recovery code you saved when you created your account, then choose a new password.</p>
    <label for="rEmail">Email</label><input id="rEmail" name="email" type="email" autocomplete="username" autocapitalize="off" value="${esc(($("#aEmail")||{}).value||"")}">
    <label for="rCode">Recovery code</label><input id="rCode" autocapitalize="characters" autocomplete="off" placeholder="XXXX-XXXX-XXXX-XXXX">
    <label for="rPass">New password</label><input id="rPass" name="new-password" type="password" autocomplete="new-password">
    <div class="err" id="rErr"></div>
    <div class="actions"><button class="btn ghost" data-close>Cancel</button><button class="btn road" id="rGo">Reset password</button></div>`,
  (root)=>{
    $("#rGo",root).onclick=async()=>{
      const b=$("#rGo",root); b.disabled=true;
      try{ const res=await api("reset",{method:"POST",body:{email:$("#rEmail",root).value,recovery:$("#rCode",root).value,password:$("#rPass",root).value}}); await signedIn(res,false); }
      catch(e){ $("#rErr",root).textContent=e.message; b.disabled=false; }
    };
  });
}
function recoverySheet(code,isNew){
  sheet("Save your recovery code",`
    <p style="margin-top:12px">${isNew==="new"?"Here's your new recovery code. The old one no longer works.":isNew?"Your account is ready.":"Your password has been changed, and you have a new recovery code. The old one no longer works."}</p>
    <p>If you forget your password, this code is the only way back into your account. Write it down or keep it in your password manager.</p>
    <div class="panel" style="text-align:center;margin:14px 0"><code style="font-size:20px;letter-spacing:1px;background:none" id="rcCode">${esc(code)}</code></div>
    <button class="btn ghost block" id="rcCopy">Copy code</button>
    <button class="btn road block" data-close style="margin-top:10px">I've saved it</button>`,
  (root)=>{ $("#rcCopy",root).onclick=async()=>{ try{ await navigator.clipboard.writeText(code); toast("Code copied"); }catch(e){ toast("Copy isn't available — write it down"); } }; });
}
// The hidden username lets password managers update the right saved login.
const pwUser = () => `<input type="text" name="username" autocomplete="username" value="${esc(account?account.email:"")}" hidden>`;
function passwordSheet(){
  const set=account.hasPassword===false;
  sheet(set?"Set a password":"Change password",`<form id="pwForm" novalidate>${pwUser()}
    ${set?`<p class="small muted" style="margin-top:12px">Add a password so you can also sign in with your email${account.email?"":" (you'll need an email on your account — contact us to add one)"}.</p>`:`<label for="pwCur">Current password</label><input id="pwCur" name="current-password" type="password" autocomplete="current-password">`}
    <label for="pwNew">New password</label><input id="pwNew" name="new-password" type="password" autocomplete="new-password" minlength="8">
    <p class="small muted" style="margin-top:6px">At least 8 characters. Your other devices will be signed out.</p>
    <div class="err" id="pwErr"></div>
    <div class="actions"><button class="btn ghost" type="button" data-close>Cancel</button><button class="btn road" id="pwGo" type="submit">${set?"Set password":"Change password"}</button></div></form>
    ${set?"":`<div style="text-align:center"><button class="linkbtn" id="pwForgot">Forgot your current password?</button></div>`}`,
  (root,close)=>{
    const pf=$("#pwForgot",root); if(pf) pf.onclick=()=>{ close(); resetSheet(); };
    $("#pwForm",root).onsubmit=async ev=>{
      ev.preventDefault();
      const b=$("#pwGo",root), err=$("#pwErr",root); err.textContent="";
      if($("#pwNew",root).value.length<8){ err.textContent="Use at least 8 characters for the new password."; return; }
      b.disabled=true;
      try{
        const res=await api("password",{method:"POST",body:{current:set?"":$("#pwCur",root).value,password:$("#pwNew",root).value}});
        close(); account.hasPassword=true; saveAuth(account); if(!screenStack.length) render();
        if(res.recovery) recoverySheet(res.recovery,"new"); else toast("Password changed");
      }
      catch(e){ err.textContent=e.message; b.disabled=false; }
    };
  });
}
function recoveryCodeSheet(){

/* ---------- app updates (Android app) ---------- */
const UPDATE_REPO = "jclissoldyasa-boop/drivemate"; // "owner/repo" on GitHub; each release carries DriveMate.apk and a tag ending in its version code
let update=null; // {version,url,name} when a newer release exists
function appVersion(){ try{ return +NATIVE.version()||0; }catch(e){ return 0; } }
async function checkUpdate(manual){
  if(!NATIVE||!UPDATE_REPO) return;
  if(!manual && Date.now()-(+lsGet("dm.updChecked")||0) < 12*36e5){
    try{ update=JSON.parse(lsGet("dm.update")||"null"); }catch(e){}
    if(update && update.version<=appVersion()) update=null;
    return;
  }
  try{
    const r=await fetch(`https://api.github.com/repos/${UPDATE_REPO}/releases/latest`,{headers:{Accept:"application/vnd.github+json"}});
    if(!r.ok) throw new Error(r.status);
    const j=await r.json();
    const v=+((String(j.tag_name).match(/(\d+)$/)||[])[1])||0;
    const apk=(j.assets||[]).find(a=>/\.apk$/i.test(a.name));
    update = apk && v>appVersion() ? {version:v,url:apk.browser_download_url,name:j.name||j.tag_name} : null;
    lsSet("dm.updChecked",String(Date.now())); lsSet("dm.update",update?JSON.stringify(update):null);
    if(manual) toast(update?"An update is available":"DriveMate is up to date");
    if(!screenStack.length) render();
  }catch(e){ if(manual) toast("Couldn't check for updates. Are you online?"); }
}
function installUpdate(){
  if(!update) return;
  try{ NATIVE.openUrl(update.url); }catch(e){}
  toast("Downloading. When it finishes, open it and tap Update");
}
function updateBanner(){
  if(!update || lsGet("dm.updSkip")===String(update.version)) return "";
  return `<div class="banner" style="background:var(--biz-soft);border-color:var(--biz)"><strong style="color:var(--biz)">Update available.</strong> A new version of DriveMate is ready. Your data stays as it is.
    <div class="row" style="margin-top:10px"><button class="btn ghost" id="updLater">Later</button><button class="btn road" id="updGo">Update</button></div></div>`;
}
function bindUpdate(){
  const g=$("#updGo"); if(g) g.onclick=installUpdate;
  const l=$("#updLater"); if(l) l.onclick=()=>{ lsSet("dm.updSkip",String(update.version)); render(); };
  const c=$("#updCheck"); if(c) c.onclick=()=>{ if(update) installUpdate(); else { c.textContent="Checking…"; checkUpdate(true); } };
}

async function shrinkImage(file){
  try{
    const img=await createImageBitmap(file);
    const s=Math.min(1,1600/Math.max(img.width,img.height));
    const c=document.createElement("canvas"); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),"image/jpeg",.82));
  }catch(e){ return file; }
}
let sampleNs;
async function readReceipt(blob){
  try{
    if(sampleNs===undefined) sampleNs = (window.claude&&claude.use) ? await claude.use("sample") : null;
    if(!sampleNs) return null;
    const lim=await sampleNs.limits().catch(()=>null); if(!lim||!lim.images) return null;
    const prompt=`The attached image is a photo of an Australian receipt for a vehicle expense (fuel, servicing, repairs, registration, insurance, tyres, tolls, parking, car wash, etc).
Read it and reply with ONLY a JSON object, no other text:
{"date":"YYYY-MM-DD or null","total":number or null (total paid incl. GST, in dollars),"litres":number or null (fuel litres if a fuel receipt),"supplier":"business name or null","description":"a few words on what was bought, or null","category":one of ${JSON.stringify(EXP_CATS)}}
Australian dates are day/month/year. If a value can't be read, use null.`;
    return await sampleNs.json(prompt,{images:[blob],modelTier:"quick"});
  }catch(e){ return null; }
}
let assetsNs;
async function uploadReceipt(blob){
  try{
    if(assetsNs===undefined) assetsNs = (window.claude&&claude.use) ? await claude.use("assets") : null;
    if(!assetsNs) return null;
    const r=await assetsNs.upload(blob); return r&&r.id||null;
  }catch(e){ return null; }
}

const slug=s=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
const csvCell=v=>{ const s=String(v??""); return /[",\n]/.test(s)?`"${s.replace(/"/g,'""')}"`:s; };
const toCsv=rows=>rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
function logbookCsv(){
  const v=veh(reportVid), c=claim(v.id,reportFy);
  const rows=[["Vehicle logbook",v.name],["Registration",v.rego||""],["Make / model",v.model||""],["Financial year",fyLabel(reportFy)],[]];
  if(c.lb){ rows.push(["Logbook period start",isoDate(c.lb.from)],["Logbook period end",isoDate(c.lb.to-864e5)],["Odometer at start of period",c.lb.startOdo??""],["Odometer at end of period",c.lb.endOdo??""],["Total km in period",Math.round(c.lb.total)],["Business km in period",Math.round(c.lb.biz)],["Business-use percentage",pct(c.lb.pctBiz)],[]); }
  rows.push(["Start date","Start time","End date","End time","Start odometer","End odometer","Kilometres","Type","Reason for journey"]);
  c.trips.slice().sort((a,b)=>a.startTs-b.startTs).forEach(t=>rows.push([isoDate(t.startTs),tFmt(t.startTs),isoDate(t.endTs||t.startTs),tFmt(t.endTs||t.startTs),t.startOdo,t.endOdo,tripKm(t),t.type==="business"?"Business":"Private",t.purpose||""]));
  rows.push([],["Odometer readings"],["Date","Odometer","Note"]);
  const [f,to]=fyRange(reportFy);
  S.odo.filter(o=>o.vid===v.id&&o.ts>=f&&o.ts<to).sort((a,b)=>a.ts-b.ts).forEach(o=>rows.push([isoDate(o.ts),o.value,o.note||""]));

}
function summaryCsv(){
  const rows=[["Financial year",fyLabel(reportFy)],[],["Vehicle","Registration","Total km","Business km","Business %","Cents/km deduction","Logbook deduction","Car expenses","Best method","Est. tax saving"]];
  S.vehicles.forEach(v=>{ const c=claim(v.id,reportFy); rows.push([v.name,v.rego||"",Math.round(c.total),Math.round(c.biz),pct(c.usePct),c.cents.toFixed(2),c.logbook.toFixed(2),c.expTotal.toFixed(2),c.best==="cents"?"Cents per km":"Logbook",c.saving.toFixed(2)]); });
  rows.push([],["Expenses"],["Vehicle","Date","Category","Amount","Litres","Supplier / note","Receipt photo"]);
  const [f,to]=fyRange(reportFy);
  S.expenses.filter(e=>e.ts>=f&&e.ts<to).sort((a,b)=>a.ts-b.ts).forEach(e=>rows.push([veh(e.vid)?.name||"",isoDate(e.ts),e.cat,(+e.amount).toFixed(2),e.litres||"",e.note||"",e.receipt?"Yes":"No"]));

}

async function exportCsv(text,filename){ return exportFile(text,filename,"text/csv"); }
async function exportFile(text,filename,mime){
  if(NATIVE){ let r="error"; try{ r=NATIVE.saveFile(filename,text,mime); }catch(e){} toast(r==="saved"?`Saved to Downloads: ${filename}`:r==="shared"?"Choose where to save it":"Couldn't save the file"); return; }
  let dl=null; try{ if(window.claude&&claude.use) dl=await claude.use("downloads"); }catch(e){}
  if(dl){ try{ await dl.save({filename,data:new Blob([text],{type:mime})}); return; }catch(e){ if(e&&e.code==="declined"||e&&e.code==="cancelled") return; } }
  try{ await navigator.clipboard.writeText(text); toast("Download isn't available here — copied instead"); }catch(e){ toast("Download isn't available in this view"); }
}

    <h3 style="margin-top:12px">Android: car wireless charger</h3>

    <h3>iPhone</h3>

}

  return `<h2>Automatic trips</h2>
  <div class="panel">
    <label class="check" style="margin-top:0"><input type="checkbox" id="autoOn" ${st.auto?"checked":""}> Start a trip when the phone goes on the wireless charger</label>
    <p class="small muted" style="margin-top:8px">Lift the phone off the charger and DriveMate asks if you've arrived. Tap End trip to save it with the GPS kilometres filled in. If the phone doesn't move 300 m within 10 minutes, the trip is cancelled, so a charger at home won't log trips.</p>
    <ul class="list" style="margin-top:6px">
      ${row(p.fine,"Location access","pLoc","Allow")}
      ${row(p.background,"Location set to Allow all the time","pBg","Fix")}
      ${row(p.notif,"Notifications on","pNot","Allow")}
      ${row(p.battery,"Battery saver won't close DriveMate","pBat","Fix")}

  </div>`;
}

  const tr=S.settings.taxRate;
  const rates=[[0,"0% — under $18,201"],[.15,"15% — $18,201–$45,000 (2026–27)"],[.16,"16% — $18,201–$45,000 (2025–26)"],[.30,"30% — $45,001–$135,000"],[.37,"37% — $135,001–$190,000"],[.45,"45% — over $190,000"]];
  return `${header("Setup")}
  <h2 style="margin-top:0">Vehicles</h2>
  <div class="panel">${S.vehicles.length?`<ul class="list">${S.vehicles.map(v=>`<li><button class="item" data-ev="${v.id}"><div><b>${esc(v.name)}</b><div class="small muted">${esc([v.rego,v.model].filter(Boolean).join(" · "))||"No details"}</div></div><span class="km">${fmtKm(currentOdo(v.id))}</span></button></li>`).join("")}</ul>`:""}
  <button class="btn block" id="addV" style="margin-top:12px">Add vehicle</button></div>
  <h2>Tax</h2>
  <div class="panel">
    <label for="tr" style="margin-top:0">Your marginal tax rate</label>
    <select id="tr">${rates.map(([r,l])=>`<option value="${r}" ${Math.abs(r-tr)<1e-6?"selected":""}>${l}</option>`).join("")}</select>
    <label class="check"><input type="checkbox" id="mc" ${S.settings.medicare?"checked":""}> Add 2% Medicare levy to the saving estimate</label>
    <p class="note">Cents per km uses ${Math.round(rateFor(fyOf(Date.now()))*100)}c for ${fyLabel(fyOf(Date.now()))}, capped at 5,000 business km per car.</p>
  </div>
  ${NATIVE?autoPanel():webAutoPanel()}
  ${accountPanel()}
  ${helpPanel()}
  <h2>Data</h2>
  <div class="panel"><p class="small muted">${esc(syncState==="local"?"Saved on this phone":syncState)}.</p>
  <button class="btn ghost block" id="backup">Download full backup (CSV)</button>
  <button class="btn ghost block" id="saveData" style="margin-top:10px">Save a DriveMate data file</button>
  <button class="btn ghost block" id="loadData" style="margin-top:10px">Load a DriveMate data file</button>
  <input type="file" id="dataFile" hidden>
  <p class="note">A data file holds everything: vehicles, trips, odometer readings and expenses. Use it to keep your own copy, or to move data between devices without an account.</p>
  <button class="btn danger block" id="wipe" style="margin-top:10px">Delete all data</button></div>`;
}
function bindSetup(){
  bindAccountPanel();
  bindUpdate();
  $("#bugBtn").onclick=bugSheet;
  $("#addV").onclick=()=>vehSheet(null);
  document.querySelectorAll("[data-ev]").forEach(b=>b.onclick=()=>vehSheet(veh(b.dataset.ev)));
  $("#tr").onchange=e=>{ S.settings.taxRate=+e.target.value; persist(); };
  $("#mc").onchange=e=>{ S.settings.medicare=e.target.checked; persist(); };
  const ts=$("#testStart"); if(ts) ts.onclick=()=>{ tab="drive"; startTrip(activeVeh()?.id); };
  if(NATIVE){
    const ao=$("#autoOn"); if(ao) ao.onchange=e=>{ try{ NATIVE.setAuto(e.target.checked); if(e.target.checked&&!nPerms().fine) NATIVE.askLocation(); }catch(err){} toast(e.target.checked?"Automatic trips on":"Automatic trips off"); };
    [["pLoc","askLocation"],["pBg","askLocation"],["pNot","askNotifications"],["pBat","askBattery"]].forEach(([id,fn])=>{ const b=$("#"+id); if(b) b.onclick=()=>{ try{ NATIVE[fn](); }catch(err){} }; });
  }
  $("#saveData").onclick=()=>{ const d=JSON.parse(JSON.stringify(S)); d.live=null;
    exportFile(JSON.stringify({app:"DriveMate",version:1,saved:new Date().toISOString(),data:d}),`drivemate-data-${isoDate(Date.now())}.json`,"application/json"); };
  $("#loadData").onclick=()=>$("#dataFile").click();
  $("#dataFile").onchange=async e=>{
    const f=e.target.files&&e.target.files[0]; e.target.value=""; if(!f) return;
    let d=null; try{ d=JSON.parse(await f.text()); }catch(err){}
    if(!d||d.app!=="DriveMate"||!d.data||!Array.isArray(d.data.vehicles)){ toast("That isn't a DriveMate data file"); return; }
    const nv=d.data.vehicles.length, nt=(d.data.trips||[]).length;
    if(!await ask(`Replace everything in DriveMate on this phone with the data file? It has ${nv} vehicle${nv===1?"":"s"} and ${nt} trip${nt===1?"":"s"}.`,"Replace data")) return;
    if(S.live) stopGps();
    S=Object.assign(blank(),d.data); S.live=null;
    new Set(S.trips.map(t=>monthKey(t.startTs))).forEach(m=>dirtyMonths.add(m));
    persist(); tab="drive"; render(); toast("Data loaded");
  };
  $("#backup").onclick=()=>{ const rows=[["Type","Vehicle","Date","Start odo","End odo","Km","Trip type","Reason / note","Amount"]];
    S.trips.forEach(t=>rows.push(["Trip",veh(t.vid)?.name,isoLocal(t.startTs),t.startOdo,t.endOdo,tripKm(t),t.type,t.purpose,""]));
    S.odo.forEach(o=>rows.push(["Odometer",veh(o.vid)?.name,isoDate(o.ts),o.value,"","","",o.note,""]));
    S.expenses.forEach(e=>rows.push(["Expense",veh(e.vid)?.name,isoDate(e.ts),"","","","",`${e.cat}${e.note?" – "+e.note:""}`,e.amount]));
    exportCsv(toCsv(rows),"drivemate-backup.csv"); };
  $("#wipe").onclick=async()=>{ if(!await ask("Delete every vehicle, trip, reading and expense? This can't be undone.")) return;
    const months=new Set(S.trips.map(t=>monthKey(t.startTs)));
    S=blank(); saveLocal(); stopGps();
    if(cloud&&me){ try{ const col=cloud.collection(`data/users/${me}`); await col.doc("config").delete(); for(const m of months) await col.doc(m).delete(); }catch(e){} }
    tab="drive"; render(); toast("All data deleted"); };
}
function vehSheet(v){
  sheet(v?"Edit vehicle":"Add vehicle",`${vehicleForm(v||{})}<div class="err" id="verr"></div>
  <div class="actions">${v?`<button class="btn danger" id="vdel">Delete</button>`:`<button class="btn ghost" data-close>Cancel</button>`}<button class="btn" id="vsave">Save vehicle</button></div>`,
  (root,close)=>{
    $("#vsave",root).onclick=()=>{ if(saveVehicle(v,false)) close(); };
    const d=$("#vdel",root); if(d) d.onclick=async()=>{ if(!await ask(`Delete ${v.name} and all its trips, readings and expenses?`)) return;
      const months=new Set(S.trips.filter(t=>t.vid===v.id).map(t=>monthKey(t.startTs)));
      S.vehicles=S.vehicles.filter(x=>x.id!==v.id); S.trips=S.trips.filter(t=>t.vid!==v.id); S.odo=S.odo.filter(o=>o.vid!==v.id); S.expenses=S.expenses.filter(e=>e.vid!==v.id);
      if(S.live&&S.live.vid===v.id) S.live=null; if(S.settings.active===v.id) S.settings.active=S.vehicles[0]?.id||null;
      persist({months:[...months]}); close(); render(); toast("Vehicle deleted"); };
  });
}

/* ---------- ui helpers ---------- */
const BACK_IC='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
let screenStack=[];
function sheet(title,html,bind){
  const scr=document.createElement("section"); scr.className="screen";
  scr.innerHTML=`<div class="screen-head"><button class="back" data-close>${BACK_IC}Back</button><h3>${esc(title)}</h3></div>${html}`;
  screenStack.forEach(x=>x.hidden=true);
  $("#app").hidden=true; $("#tabsNav").hidden=true;
  $("#screens").appendChild(scr); screenStack.push(scr);
  let closed=false;
  const close=()=>{ if(closed) return; closed=true; scr.remove(); screenStack=screenStack.filter(x=>x!==scr);
    const prev=screenStack[screenStack.length-1];
    if(prev) prev.hidden=false; else { $("#app").hidden=false; $("#tabsNav").hidden=false; }
    toTop(); };
  scr.querySelectorAll("[data-close]").forEach(b=>b.onclick=close);
  toTop();
  bind(scr,close);
}
function closeAllScreens(){ screenStack.forEach(x=>x.remove()); screenStack=[]; $("#app").hidden=false; $("#tabsNav").hidden=false; }
function ask(msg,ok="Yes, delete"){
  return new Promise(res=>{
    let done=false;
    sheet("Are you sure?",`<p style="margin-top:12px">${esc(msg)}</p><div class="actions"><button class="btn ghost" id="aNo">Cancel</button><button class="btn danger" id="aYes">${esc(ok)}</button></div>`,(root,close)=>{
      root.querySelector("[data-close]").onclick=()=>{ close(); if(!done){done=true;res(false);} };
      $("#aNo",root).onclick=()=>{ close(); done=true; res(false); };
      $("#aYes",root).onclick=()=>{ close(); done=true; res(true); };
    });
  });
}
let toastT=null;
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),2200); }

/* ---------- odometer boxes: show 100,000 while the code reads 100000 ---------- */
const INPUT_VALUE=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,"value");
const groupDigits=s=>s.replace(/\B(?=(\d{3})+(?!\d))/g,",");
function enhanceOdo(el){
  if(el._odo) return; el._odo=true;
  Object.defineProperty(el,"value",{configurable:true,
    get(){ return INPUT_VALUE.get.call(this).replace(/\D/g,""); },
    set(v){ INPUT_VALUE.set.call(this,groupDigits(String(v??"").replace(/\D/g,""))); }});
  el.value=INPUT_VALUE.get.call(el);
  el.addEventListener("input",()=>{
    const raw=INPUT_VALUE.get.call(el), pos=el.selectionStart??raw.length;
    const before=raw.slice(0,pos).replace(/\D/g,"").length, out=groupDigits(raw.replace(/\D/g,""));
    if(out===raw) return;
    INPUT_VALUE.set.call(el,out);
    let i=0,d=0; while(i<out.length&&d<before){ if(/\d/.test(out[i])) d++; i++; }
    try{ el.setSelectionRange(i,i); }catch(e){}
  },true);
}
new MutationObserver(()=>document.querySelectorAll("input.odo").forEach(enhanceOdo)).observe(document.body,{childList:true,subtree:true});

loadLocal();
$("#brand").innerHTML=`<img src="${LOGO}" alt=""><span class="wm"><b>Drive</b><i>Mate</i></span>`;
if(NATIVE) syncFromNative(); else if(S.live) startGps();
(function handleLaunch(){
  let p=null, e=null;
  try{
    if(location.pathname==="/auth/done") throw 0; // a sign-in return, not a trip shortcut
    const q=new URLSearchParams(location.search); p=q.get("start"); e=q.get("end");
    if(!p&&!e&&location.hash.length>1){ const h=new URLSearchParams(location.hash.slice(1)); if(location.hash.includes("start")) p=h.get("start")||"1"; if(location.hash.includes("end")) e=h.get("end")||"1"; }
    if(p||e) history.replaceState(null,"",location.pathname);
  }catch(err){}
  if(p && S.vehicles.length && !S.live){ tab="drive"; startTrip(veh(p)?p:activeVeh().id); return; }
  if(e && S.live){ tab="drive"; render(); endTripSheet(); return; }
  render();
})();
initCloud();
loadConfig();
storageNotice();
if(location.pathname==="/auth/done") authReturn();
checkUpdate(false).then(()=>{ if(update&&!screenStack.length) render(); });
document.addEventListener("visibilitychange",()=>{
  if(document.hidden || inClaude() || !account) return;
  if(!cloud || hasPending()) initCloud();
  else if(!screenStack.length) connect(accountStore,"me").then(()=>{ if(!screenStack.length) render(); }).catch(()=>{});
});
window.addEventListener("online",()=>{ if(account && !inClaude()) initCloud(); });
